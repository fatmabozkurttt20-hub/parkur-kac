name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libtool-bin autopoint gettext pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev

      - name: Build with buildozer
        run: |
          export ACLOCAL_PATH=/usr/share/aclocal
          yes | buildozer android debug
 cython

      - name: Build with buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parkurkac-apk
          path: bin/*.apk